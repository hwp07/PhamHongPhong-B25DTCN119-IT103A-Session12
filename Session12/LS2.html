<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="LS2.css">
    <!DOCTYPE html>
    <html lang="vi">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Course Card</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="LS2.css" />
    </head>

<body>

    <div class="course-card">
        <div class="course-img">
            <span class="badge">Bán chạy</span>
            <i class="fa-solid fa-code"></i>
        </div>

        <div class="course-body">
            <div class="top">
                <span class="tag">Lập trình</span>
                <span class="rate">
                    <i class="fa-solid fa-star"></i> 4.9
                </span>
            </div>

            <h3>Lập trình Web Full Stack</h3>

            <p class="desc">
                Học lập trình web từ cơ bản đến nâng cao với các công nghệ hiện đại nhất
            </p>

            <div class="info">
                <span><i class="fa-regular fa-clock"></i> 40 giờ</span>
                <span><i class="fa-solid fa-users"></i> 12K+ học viên</span>
            </div>

            <hr>

            <div class="bottom">
                <span class="price">2.990.000đ</span>
                <button>Xem chi tiết</button>
            </div>
        </div>
    </div>

</body>

</html>
